syntax = "proto3";

package futureq;

option go_package = "github.com/futureq-io/protocol/proto/go";

// SubscribeInit is the first frame that a consumer must send on the Subscribe
// stream. It binds a worker to a previously created durable subscription.
message SubscribeInit {
    // topic is the name of the channel to subscribe to.
    string topic    = 1;

    // group_id identifies the consumer group. Consumers sharing the same
    // group_id compete for messages (one delivery per group). Different
    // group_ids on the same topic each receive an independent copy of every
    // message (fan-out).
    string group_id = 2;

    // Stable identity for an independent universal subscription. Set exactly
    // one of group_id and subscriber_id. CreateSubscription must precede this stream.
    string subscriber_id = 3;

}

// AckRequest is sent by the consumer to acknowledge or reject a message.
message AckRequest {
    // success=true completes this subscription's delivery. The shared message
    // is deleted only after all destination subscriptions finish.
    // success=false: message was rejected (NACK); the broker will re-dispatch
    //   it to another consumer on the next dispatcher tick.
    bool  success      = 1;

    // delivery_tag must be the exact bytes received in QueueMessage.delivery_tag.
    bytes delivery_tag = 2;
}

// ConsumerFrame is the union type sent by the consumer on the Subscribe stream.
// The very first frame must carry a SubscribeInit. All subsequent frames must
// carry AckRequest.
message ConsumerFrame {
    oneof body {
        SubscribeInit init = 1;
        AckRequest    ack  = 2;
    }
}

// QueueMessage is pushed by the broker to the consumer when a message becomes
// eligible for delivery (its delay has elapsed).
message QueueMessage {
    // topic is the channel this message was published on.
    string topic        = 1;

    // payload is the application data originally sent by the producer.
    bytes  payload      = 2;

    // delivery_tag is an opaque server-assigned identifier (the raw Pebble
    // key). The consumer must echo this in AckRequest.delivery_tag.
    bytes  delivery_tag = 3;

    // enqueued_at_unix_ms is the broker wall-clock time (Unix ms) when the
    // message was first received. Useful for computing actual delivery latency.
    int64  enqueued_at_unix_ms = 4;

    // delay_ms is the original delay requested by the producer.
    int64  delay_ms = 5;
}

// A durable interest, independent of any network connection. Exactly one of
// group_id (competing workers) and subscriber_id (independent fan-out) is required.
message SubscriptionRequest {
    string topic = 1;
    string group_id = 2;
    string subscriber_id = 3;
}
message SubscriptionResponse {
    string topic = 1;
    string group_id = 2;
    string subscriber_id = 3;
    // Changes after deletion/recreation; connections bind to one generation.
    string generation = 4;
}
message UnsubscribeResponse {}

service FutureQConsumer {
    // Idempotently declares durable interest without opening a consumer stream.
    rpc CreateSubscription(SubscriptionRequest) returns (SubscriptionResponse);
    // Stops future routing and discards this subscription's pending deliveries.
    // Backlog cleanup is asynchronous; other subscriptions are unaffected.
    rpc Unsubscribe(SubscriptionRequest) returns (UnsubscribeResponse);
    // Subscribe is a bidirectional streaming RPC. The client sends a
    // ConsumerFrame stream (first frame = SubscribeInit, subsequent frames =
    // AckRequest). The server pushes QueueMessage frames whenever messages
    // become ready for the subscribed topic and group.
    rpc Subscribe(stream ConsumerFrame) returns (stream QueueMessage);
}